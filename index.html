<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work-Study Program</title>

  <style>
    /* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(to right, #eaf1fb, #f4f7fb);
    }

    /* HEADER */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: linear-gradient(135deg, #3f5f8a, #5b8def);
      color: white;
    }

    .header-left h1 {
      font-size: 28px;
    }

    .header-left p {
      font-size: 14px;
      opacity: 0.9;
    }

    .header-right nav {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .header-right a {
      color: white;
      text-decoration: none;
      font-size: 14px;
    }

    .header-right a:hover {
      text-decoration: underline;
    }

    /* BUTTONS */
    .btn {
      background: white;
      color: #3f5f8a !important;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 500;
    }

    .btn.outline {
      background: transparent;
      border: 1.5px solid white;
      color: white !important;
    }

    /* MAIN CONTENT */
    .content {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      padding: 50px;
      max-width: 950px;
      margin: auto;
    }

    /* CARDS */
    .card {
      background: white;
      padding: 70px;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.12);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 25px 50px rgba(0,0,0,0.18);
    }

    .card h2 {
      margin-bottom: 12px;
      color: #3f5f8a;
    }

    .card p {
      font-size: 15px;
      margin-bottom: 20px;
      color: #444;
    }

    /* CARD BUTTON */
    .card-btn {
      display: inline-block;
      padding: 10px 18px;
      background: #5b8def;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 14px;
    }

    .card-btn:hover {
      background: #3f5f8a;
    }

    /* FOOTER */
    footer {
      background: #3f5f8a;
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 14px;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        text-align: center;
        gap: 15px;
      }

      .header-right nav {
        flex-wrap: wrap;
        justify-content: center;
      }

      .content {
        padding: 30px 20px;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <div class="header-left">
    <h1>Student Work-Study Program</h1>
    <p>Manage. Learn. Earn.</p>
  </div>

  <div class="header-right">
    <nav>
      <a href="admin.html"class="btn outline">Admin</a>
      <a href="student.html"class="btn outline">Student</a>
      <a href="apply.html"class="btn outline">Apply</a>
      <a href="signup.html" class="btn outline">Sign Up</a>
    </nav>
  </div>
</header>

<main class="content">
  <div class="card">
    <h2>🎓 For Students</h2>
    <p>Apply for jobs, track work hours, and receive feedback easily.</p>
    <a href="student.html" class="card-btn">Explore</a>
  </div>

  <div class="card">
    <h2>🛠 For Admin</h2>
    <p>Post jobs, manage applications, and monitor student work.</p>
    <a href="admin.html" class="card-btn">Manage</a>
  </div>
</main>

<footer>
  © 2025 Work-Study System
</footer>

</body>
</html>
